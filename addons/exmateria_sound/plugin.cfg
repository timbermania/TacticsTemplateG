[plugin]

name="ExMateria Sound"
description="Final Fantasy Tactics (PSX) sound reimplementation: SMD music + battle effect SFX, driven by a native C++ SPU core. See README.md."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — DECLARED and MEASURED, for `exmateria_spu/plugin.cfg`'s
; reason and by the same two measurements (zero fork primitives here; this
; package's own rigs boot `$GODOT_STOCK` and never `$GODOT_FORK`). #1286.
engine="stock"
; The sibling addon this one reaches and therefore needs staged with it.
; MEASURED, not assumed: `grep -rn 'res://addons/exmateria_spu'` over this addon
; reports **15 lines in 14 files** — `exmateria_sound.gd:74-76` publishes `Spu`,
; `Sample` and `ADSR` straight off it, and eleven `runtime/` files preload
; `spu.gd` for the mixer. The edge runs one way only: the same grep from
; `exmateria_spu` back to here returns nothing, so the SPU is a leaf and this
; closure is two addons deep and no deeper.
;
; 🔴 THE README ALREADY SAID SO, IN PROSE, IN THE ONE PLACE A RIG CANNOT READ:
; *"The `exmateria_sound-vX.Y.Z.zip` release vendors `addons/exmateria_spu/`"*.
; Vendoring IS this declaration, written for a human downloading a ZIP. `deps=`
; is the same fact written for `tests/stranger/shared/rig.sh`, which stages the
; transitive closure of these lines and, until now, could not stage this package
; at all — a consumer addon naming it got `CANNOT RUN: … declares no engine=`.
deps="exmateria_spu"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED, and for this package it
; is the only thing that can say so. `system` is one of `kernel port system
; rules`: this addon is one of the eleven (`Audio`), so reaching it is NOT free.
;
; 🔴 THE INFERENCE IT REPLACES WAS BLIND HERE, NOT MERELY WRONG. This package
; sits OUTSIDE `classify_blueprint`'s walk (#326 — the host's copy is a
; deployment copy and walking it would double-count), so `classify()` has no
; verdict for any of its 155 files and the modal-bucket vote returned None for
; all of them. None was the FREE set. The only thing standing between that and a
; free verdict was `_walk_roots.EXTRACTED` naming this path by hand; the vote
; itself has never once answered the question for a package it was not told
; about. `EXTRACTED` still declares the system NAME (`Audio`); this line declares
; the tier.
tier="system"
