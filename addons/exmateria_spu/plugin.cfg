[plugin]

name="ExMateria SPU"
description="A PlayStation 1 SPU for Godot: 24 voices of ADPCM with the console's own ADSR, pitch/volume LFOs, noise, FM and reverb, mixed by a native C++ core and delivered as an AudioStream. Bring your own samples. See README.md."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; ADR-0194 dec. 7 — the engine this addon needs, DECLARED so a rig can run the
; right binary and CHECK the claim, and #1286 is why this line exists now: a
; `deps=` closure is only stageable if every addon in it declares one, and
; `godot-learning`'s `addons/exmateria_effects` reaches this package.
;
; `stock` is MEASURED, twice and in two directions:
;   * `grep -rl 'compositor_fold\|CompositorRenderLayer\|is_compositor_layer_supported\|CompositorEffect'`
;     over this addon reports ZERO files — nothing here names a fork primitive;
;   * this package's own two acceptance rigs already boot `$GODOT_STOCK`, 30
;     invocations across `workspace/acceptance/stranger_{sound,spu}/run.sh` and
;     `$GODOT_FORK` not once. So the declaration records what those rigs have
;     been asserting all along rather than introducing a new claim.
;
; 🔴 A `.gdextension` IS NOT A FORK REQUIREMENT. This addon ships
; `exmateria_spu.gdextension` and a native `.so`, which is an ABI requirement on
; the build, not a requirement for the compositor fork; `engine=` answers only
; the second question (ADR-0194 dec. 7).
engine="stock"
; #1059 / ADR-0271 — the TIER this addon is in, DECLARED, and for this package it
; is the only thing that can say so — `classify()` has no verdict for any of its
; 8 files, for the sibling row's reason. `system` matches what
; `_walk_roots.EXTRACTED` already declares (`Audio`), which keeps the verdict it
; has today: `exmateria_sound` names `Spu` on 51 lines and those are free on the
; SAME-PACKAGE ground (ADR-0003 dec. 4's vendoring), not on a tier ground.
;
; 🔴 WHETHER THIS IS REALLY A SYSTEM IS OPEN, and declaring it is what makes the
; question askable. The description above is a generic PlayStation SPU that
; brings no samples — which reads like a `port`, not like the Audio system. It is
; declared `system` here because that is what the tree measures today and a tier
; declaration must not smuggle in a re-pricing; ADR-0271 records it as a soft
; spot.
tier="system"
