[plugin]

name="ExMateria Effects"
description="Effect file models, cast playback, camera/color/sound/particle subsystems, callbacks, TRAP primitives and native/fold carrier production. Registers three autoloads; publishes ExMateriaEffects. See README.md."
author="timbermania"
version="0.1.0"
script="plugin.gd"
; Full install/fold validation still uses the fork (ADR-0194). Native playback
; is available through EngineFoldCompositor.setup_native(camera) only on a
; non-fold-capable renderer (including GL). Fork Forward+ must use setup(camera)
; so callbacks have their fold bracket. No exact-stock-version certification.
engine="fork"
; Portable playback does not require rules or a terrain implementation.
; The host owns ability routing; cinematic facing takes a column-height query.
; Sound retains its own exmateria_spu dependency and existing native binaries.
; Render remains required for the optional fold bracket; no renderer split here.
deps="exmateria_platform exmateria_render exmateria_schema exmateria_sound"
; Effects is a system, not a free kernel/port tier (ADR-0271).
tier="system"
