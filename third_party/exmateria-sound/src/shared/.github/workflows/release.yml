name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Releases ship the source (GitHub auto-attaches the tarball + zip) PLUS
# prebuilt static libraries for Linux/Windows/macOS. A static lib is
# toolchain/ABI-specific, so the source + FetchContent path stays the
# primary recommendation — the prebuilt archives are a convenience for
# consumers on a matching toolchain.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build static library
        run: cmake --build build --config Release

      - name: Stage artifact (lib + public headers)
        shell: bash
        run: |
          pkg="exmateria-spu-core-${{ matrix.name }}"
          mkdir -p "dist/$pkg/lib" "dist/$pkg/include/detail"
          # Static lib: single-config (Makefiles/Ninja) or multi-config (MSVC) layout.
          find build \( -name 'libexmateria_spu_core.a' -o -name 'exmateria_spu_core.lib' \) \
            -exec cp {} "dist/$pkg/lib/" \;
          cp ./*.h "dist/$pkg/include/"
          cp detail/*.inc "dist/$pkg/include/detail/"
          cp README.md CMakeLists.txt "dist/$pkg/"

      - name: Archive
        shell: bash
        run: |
          pkg="exmateria-spu-core-${{ matrix.name }}"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$pkg.zip" "$pkg" >/dev/null
          else
            tar czf "$pkg.tar.gz" "$pkg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
          body: |
            Prebuilt static libraries (lib + public headers) for Linux,
            Windows, and macOS are attached below. A static library is
            toolchain/ABI-specific — if your compiler or C++ runtime differs
            from the CI toolchain (GCC/libstdc++, MSVC, AppleClang/libc++),
            build from source instead.

            ## Using it from CMake (source — recommended)

            ```cmake
            include(FetchContent)
            FetchContent_Declare(
                exmateria_spu_core
                GIT_REPOSITORY https://github.com/timbermania/ExMateria-SPU-Core.git
                GIT_TAG        ${{ github.ref_name }}
            )
            FetchContent_MakeAvailable(exmateria_spu_core)
            target_link_libraries(your_target PRIVATE exmateria::spu_core)
            ```
